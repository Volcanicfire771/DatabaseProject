<div class="modal fade" id="editModal-{{ tire.id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'tires_update' tire.id %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Edit Tire: {{ tire.serial_number }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Serial Number</label>
                            <input type="text" name="serial_number" class="form-control" value="{{ tire.serial_number }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Pattern</label>
                            <select name="pattern" class="form-control">
                                {% for p in tire_patterns %}
                                    <option value="{{ p.id }}" {% if tire.pattern.id == p.id %}selected{% endif %}>{{ p }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Status</label>
                            <select name="status" class="form-control">
                                {% for s in tire_statuses %}
                                    <option value="{{ s.id }}" {% if tire.status.id == s.id %}selected{% endif %}>{{ s.get_name_display }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Supplier</label>
                            <select name="supplier" class="form-control">
                                {% for sup in suppliers %}
                                    <option value="{{ sup.id }}" {% if tire.supplier.id == sup.id %}selected{% endif %}>{{ sup.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Purchase Date</label>
                            <input type="date" name="purchase_date" class="form-control" value="{{ tire.purchase_date|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Purchase Price</label>
                            <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{ tire.purchase_price }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Current Tread Depth</label>
                            <input type="number" step="0.01" name="current_tread_depth" class="form-control" value="{{ tire.current_tread_depth }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Current Pressure</label>
                            <input type="number" name="current_pressure" class="form-control" value="{{ tire.current_pressure }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Size</label>
                            <input type="text" name="size" class="form-control" value="{{ tire.size }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small">Retread Count</label>
                            <input type="number" name="retread_count" class="form-control" value="{{ tire.retread_count }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small">Max Retreads</label>
                            <input type="number" name="max_retreads" class="form-control" value="{{ tire.max_retreads }}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold small text-muted">Current Position (Read Only)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control bg-light" 
                                    value="{% if tire.current_position %}{{ tire.current_position.vehicle.license_plate }} - {{ tire.current_position.position_name }}{% else %}In Warehouse{% endif %}" 
                                    readonly>
                            </div>
                            <div class="form-text mt-1">
                                <i class="bi bi-info-circle"></i> To change position, use the <strong>History/Assign</strong> button.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                  <a href="{% url 'tires_delete' tire.id %}" 
                    class="btn btn-outline-danger" 
                    onclick="return confirm('Are you sure you want to delete Serial #{{ tire.serial_number }}? This cannot be undone.')">
                      <i class="bi bi-trash"></i> Delete
                  </a>
                  
                  <div>
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-warning">Save Changes</button>
                  </div>
              </div>
            </div>
        </form>
    </div>
</div>
