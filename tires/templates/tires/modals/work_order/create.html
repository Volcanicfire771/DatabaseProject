<div class="modal fade" id="createWorkOrderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'work_order_create' %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-file-earmark-plus"></i> Open New Work Order</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Vehicle</label>
                            {{ create_form.vehicle }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Current Odometer (KM)</label>
                            {{ create_form.current_odometer }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Driver (Reporting Issue)</label>
                            {{ create_form.driver }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Assigned To (Mechanic)</label>
                            {{ create_form.assigned_to }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold small">Initial Status</label>
                            {{ create_form.status }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold small">Internal Notes</label>
                            {{ create_form.notes }}
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success px-4">Create Work Order</button>
                </div>
            </div>
        </form>
    </div>
</div>
