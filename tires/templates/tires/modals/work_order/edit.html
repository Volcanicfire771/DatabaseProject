<div class="modal fade" id="editWorkOrderModal-{{ order.id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'work_order_update' order.id %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square"></i> Manage Work Order #{{ order.id }}
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    {% if order.status == 'C' %}
                    <div class="alert alert-secondary py-2 small">
                        <i class="bi bi-lock-fill"></i> This order is <strong>Closed</strong>. Changes will update historical records.
                    </div>
                    {% endif %}

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Vehicle</label>
                            <select name="vehicle" class="form-select">
                                {% for v in vehicles %}
                                    <option value="{{ v.id }}" {% if order.vehicle.id == v.id %}selected{% endif %}>{{ v.license_plate }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Odometer at Order (KM)</label>
                            <input type="number" name="current_odometer" class="form-control" value="{{ order.current_odometer }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Driver</label>
                            <select name="driver" class="form-select">
                                <option value="">-- Select --</option>
                                {% for e in employees %}
                                    <option value="{{ e.id }}" {% if order.driver.id == e.id %}selected{% endif %}>{{ e.first_name }} {{ e.last_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Assigned Mechanic</label>
                            <select name="assigned_to" class="form-select">
                                <option value="">-- Select --</option>
                                {% for e in employees %}
                                    <option value="{{ e.id }}" {% if order.assigned_to.id == e.id %}selected{% endif %}>{{ e.first_name }} {{ e.last_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Current Status</label>
                            <select name="status" class="form-select {% if order.status == 'O' %}border-primary{% endif %}">
                                {% for code, name in order.STATUSES %}
                                    <option value="{{ code }}" {% if order.status == code %}selected{% endif %}>{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Total Service Cost ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" name="cost" class="form-control" 
                                       value="{{ order.cost|default:'0.00' }}" 
                                       {% if order.status != 'C' %}placeholder="Enter when closing"{% endif %}>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold small">Work Description & Notes</label>
                            <textarea name="notes" class="form-control" rows="3">{{ order.notes }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <span class="text-muted small">Opened on: {{ order.date_created|date:"Y-m-d H:i" }}</span>
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4">Save Updates</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
