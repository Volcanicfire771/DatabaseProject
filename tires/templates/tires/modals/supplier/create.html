<div class="modal fade" id="createSupplierModal" tabindex="-1" aria-labelledby="createSupplierModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'supplier_create' %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="createSupplierModalLabel">Register New Supplier</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Company Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Continental Tyres Ltd" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Contact Person</label>
                            <input type="text" name="contact_person" class="form-control" placeholder="Full Name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Position</label>
                            <input type="text" name="position" class="form-control" placeholder="e.g. Account Manager" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+123 456 789">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@company.com">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold">Initial Evaluation</label>
                            <select name="evaluation" class="form-select">
                                <option value="1">1 - Poor</option>
                                <option value="2">2 - Fair</option>
                                <option value="3" selected>3 - Good (Default)</option>
                                <option value="4">4 - Excellent</option>
                                <option value="5">5 - Top Tier</option>
                            </select>
                            <div class="form-text">Select the quality tier based on previous interactions.</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Physical Address</label>
                            <textarea name="address" class="form-control" rows="2" placeholder="Street, City, Postcode"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary px-4">Save Supplier</button>
                </div>
            </div>
        </form>
    </div>
</div>
