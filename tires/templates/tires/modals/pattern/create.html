<div class="modal fade" id="createPatternModal" tabindex="-1" aria-labelledby="createPatternLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'pattern_create' %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="createPatternLabel"><i class="bi bi-gear-wide-connected"></i> Define New Tire Pattern</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Brand Name</label>
                            <input type="text" name="brand_name" class="form-control" placeholder="e.g., Michelin, Bridgestone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Pattern Code</label>
                            <input type="text" name="pattern_code" class="form-control" placeholder="e.g., X Multi Z, R192">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Country of Origin</label>
                            <input type="text" name="country_of_origin" class="form-control" placeholder="e.g., Japan" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Road Type</label>
                            <select name="road_type" class="form-select" required>
                                <option value="" selected disabled>Choose...</option>
                                <option value="H">Highway</option>
                                <option value="R">Regional</option>
                                <option value="U">Urban</option>
                                <option value="O">Off-Road</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Axle Type</label>
                            <select name="axle_type" class="form-select" required>
                                <option value="" selected disabled>Choose...</option>
                                <option value="S">Steer</option>
                                <option value="D">Drive</option>
                                <option value="T">Trailer</option>
                                <option value="A">All-Position</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Load Index</label>
                            <input type="number" name="load_index" class="form-control" placeholder="e.g., 152" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Speed Symbol</label>
                            <input type="text" name="speed_symbol" class="form-control" placeholder="e.g., L" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold text-primary">Initial Tread (mm)</label>
                            <input type="number" step="0.01" name="initial_tread_depth" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-danger">Discarding Tread (mm)</label>
                            <input type="number" step="0.01" name="discarding_tread_depth" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-success">Ideal Pressure (PSI)</label>
                            <input type="number" name="ideal_pressure" class="form-control" placeholder="e.g., 120" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-5">Create Pattern</button>
                </div>
            </div>
        </form>
    </div>
</div>
