<div class="modal fade" id="editVehicleModal{{ vehicle.id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form method="post" action="{% url 'vehicle_update' vehicle.id %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Edit Vehicle: {{ vehicle.license_plate }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">License Plate</label>
                            <input type="text" name="license_plate" class="form-control" value="{{ vehicle.license_plate }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Make</label>
                            <input type="text" name="make" class="form-control" value="{{ vehicle.make }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Year</label>
                            <input type="number" name="year" class="form-control" value="{{ vehicle.year }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Vehicle Type</label>
                            <select name="vehicle_type" class="form-select">
                                <option value="Truck" {% if vehicle.vehicle_type == "Truck" %}selected{% endif %}>Truck</option>
                                <option value="Trailer" {% if vehicle.vehicle_type == "Trailer" %}selected{% endif %}>Trailer</option>
                                <option value="Bus" {% if vehicle.vehicle_type == "Bus" %}selected{% endif %}>Bus</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Current Odometer (km)</label>
                            <input type="number" name="odometer" class="form-control" value="{{ vehicle.odometer }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Operational Tires</label>
                            <input type="number" name="num_op_tires" class="form-control" value="{{ vehicle.num_op_tires }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Spare Tires</label>
                            <input type="number" name="num_sp_tires" class="form-control" value="{{ vehicle.num_sp_tires }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold text-danger">Current Status *</label>
                            <textarea name="status" class="form-control" rows="2" required>{{ vehicle.status }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold text-danger">Tire Configuration *</label>
                            <textarea name="tire_configuration" class="form-control" rows="2" required>{{ vehicle.tire_configuration }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success px-5">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
