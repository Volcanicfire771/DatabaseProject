{% extends 'tires/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Employee Directory</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createEmployeeModal">
            Add Employee
        </button>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Position</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.first_name }} {{ emp.last_name }}</td>
                <td>{{ emp.position }}</td>
                <td>{{ emp.email }}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editModal{{ emp.id }}">Edit</button>
                    <a href="{% url 'employee_delete' emp.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this employee?')">Delete</a>
                </td>
            </tr>

            <div class="modal fade" id="editModal{{ emp.id }}" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" action="{% url 'employee_update' emp.id %}">
                        {% csrf_token %}
                        <div class="modal-content">
                            <div class="modal-header"><h5>Edit Employee</h5></div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ emp.first_name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ emp.last_name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Position</label>
                                    <input type="text" name="position" class="form-control" value="{{ emp.position }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ emp.email }}" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            {% endfor %}
        </tbody>
    </table>
</div>

<div class="modal fade" id="createEmployeeModal" tabindex="-1">
    <div class="modal-dialog">
        <form method="post" action="{% url 'employee_create' %}">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header bg-primary text-white"><h5>New Employee</h5></div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Position</label>
                        <input type="text" name="position" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary w-100">Create Employee</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
